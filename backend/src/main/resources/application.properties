spring.application.name=cafejunin
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.profiles.default=memory
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
server.error.include-message=never
app.security.enabled=${SECURITY_ENABLED:false}
app.security.audience=${OIDC_AUDIENCE:cafejunin-api}
app.keycloak.url=${KEYCLOAK_URL:http://localhost:8081}
app.keycloak.realm=${KEYCLOAK_REALM:cafejunin}
app.keycloak.client=${KEYCLOAK_CLIENT:cafejunin-web}
app.predictor.mode=${PREDICTOR_MODE:rules}
app.predictor.url=${PREDICTOR_URL:http://127.0.0.1:8001/predict}
app.predictor.key=${AI_API_KEY:}
