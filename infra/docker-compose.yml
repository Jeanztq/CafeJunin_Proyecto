services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copie .env.example a .env}
    ports: ["127.0.0.1:1433:1433"]
    volumes: ["sqlserver-data:/var/opt/mssql", "../database/sqlserver:/scripts:ro"]
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
  keycloak:
    extends:
      file: identidad.compose.yml
      service: keycloak
  ai:
    build: ../ai-service
    environment:
      AI_API_KEY: ${AI_API_KEY:?Configure .env}
    ports: ["127.0.0.1:8001:8001"]
volumes:
  sqlserver-data:
  keycloak-data:
